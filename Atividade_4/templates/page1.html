<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>{% block title %}{% endblock %} - Flask Menu</title>
</head>
<body>

    <div class="menu">
        <nav>
            <ul>
                <!-- url_for também é usado para navegar entre rotas do Flask -->
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('page1') }}">Projetos para o futuro</a></li>
                <li><a href="{{ url_for('page2') }}">O que você gosto de fazer</a></li>
            </ul>
        </nav>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <div class="texto">
        <h1>Projetos para o futuro</h1>

        <div id="texto2">
            <h2>1 - Viajar</h2> 
            <ul  class="ul">
                <li>Viajar para europa</li>
                <li>Viajar para os EUA</li>
            </ul>
            <h2>2 - Conquistas e Bens Materiais</h2> 
            <ul  class="ul">
                <li>Comprar um carro</li>
                <li>Financiar ou mobiliar a casa própria</li>
            </ul>
        </div>
    </div>
    
    
</body>
</html>
